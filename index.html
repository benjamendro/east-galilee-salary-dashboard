<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>const PUBLIC = true;</script>
</head>
<body>
<title>שכר ותעסוקה · אשכול גליל מזרחי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   אופציה ג2 — „הקונסולה, משודרגת”.
   השלד של הקונסולה הקיימת (כותרת → שלוש לשוניות לפי מקור → סרגל בוררים → מדדים → פאנלים),
   עם כוחות שולחן העבודה בתוכו: בורר רשות גלובלי באמת, כותרות-טענה, small multiples, טבלה חיה,
   מצב בכתובת, CSV. מפת צבעים: כל צבע = תפקיד אחד, בכל שלוש הלשוניות.
   ========================================================================== */
:root{
  color-scheme: light;
  /* --- משטחים --- */
  --bg-page:#F2F6F9;      /* רקע העמוד */
  --bg-canvas:#FFFFFF;    /* כרטיסים, פאנלים, פקד לא נבחר */
  --on-dark:#FFFFFF;      /* טקסט על רקע כהה (תג מקור, פקד נבחר, tooltip) */
  --bg-hover:#E7EEF4;     /* ריחוף על פקד */
  --bg-sel:#FBF6EA;       /* „הרשות שלי” — רקע העמודה/השורה/התא שלה בכל גרף וטבלה */
  --line-sel:#D9C79A;     /* „הרשות שלי” — מסגרת */
  --bg-caveat:#FBEFEC;    /* רקע סייג */
  --line-caveat:#E4B7B1;  /* מסגרת סייג */
  --bg-note:#DBEEF4;      /* הערת „שלושה מקורות — למה המספרים שונים” */
  --bg-claim:#FAF7F2;     /* רקע „השורה התחתונה” ומשפט המסקנה */
  /* --- דיו --- */
  --ink:#14273F;          /* טקסט ראשי וטבעת פוקוס. אותו גוון הוא זהות הביטוח הלאומי (מחייב בבריף) */
  --ink-2:#41566B;        /* טקסט משני */
  --ink-3:#5C6E80;        /* תוויות צירים, טקסט שלישוני (לא #74879A — נכשל AA) */
  --hair:#DCE5EC;         /* קווי מתאר, רשת בגרפים */
  --hair-2:#C3D2DC;       /* מסגרת פקדים */
  --tip-title:#54C4E0;    /* כותרת tooltip על רקע כהה */
  /* --- זהות מקור = גם צבע הסימנים העיקריים של אותו מקור בגרף --- */
  --src-cbs:#1C70A8;      /* הלמ"ס — נתוני שכר */
  --src-btl:#14273F;      /* ביטוח לאומי */
  --src-biz:#6E4A1A;      /* הלמ"ס — מרשם העסקים; גם המדרגה הכהה (50+) ברמפת הגודל, שבנויה בגוון המקור */
  --tint-cbs:rgba(28,112,168,.07);   /* רקע סרגל הבוררים — הלמ"ס */
  --tint-btl:rgba(20,39,63,.06);     /* רקע סרגל הבוררים — ביטוח לאומי */
  --tint-biz:rgba(110,74,26,.08);    /* רקע סרגל הבוררים — מרשם העסקים */
  /* --- תפקידי נתונים (אחד לכל צבע, בכל הלשוניות) --- */
  --ref-nat:#A8823A;      /* „הארץ” — תמיד מקווקו/סימון, בכל מקור */
  --ref-cluster:#6E8CA8;  /* „האשכול” כקו השוואה — בכל מקור */
  --up:#16794A;           /* עלייה / מעל הבסיס (תמיד עם ▲ וערך) */
  --down:#C0342B;         /* ירידה / מתחת לבסיס (תמיד עם ▼ וערך). אותה משמעות כמדרגה 1 ברמפה: מתחת לממוצע */
  --band-0:#8F1D14;       /* התפלגות: עד שכר המינימום */
  --band-1:#C0342B;       /* התפלגות: עד 75% מהממוצע */
  --band-2:#E39189;       /* התפלגות: עד השכר הממוצע */
  --band-3:#A9DCC5;       /* התפלגות: עד פי 2 */
  --band-4:#5AB68B;       /* התפלגות: עד פי 3 */
  --band-5:#17794A;       /* התפלגות: עד פי 4 */
  --band-6:#0B5233;       /* התפלגות: מעל פי 4 */
  --mix-emp:#E7E4DE;      /* שכירים ועצמאים: שכירים בלבד (הרוב — ניטרלי) */
  --mix-both:rgba(140,28,90,.5); /* שכירים ועצמאים: שכירים וגם עצמאים */
  --mix-self:#8C1C5A;     /* שכירים ועצמאים: עצמאים בלבד */
  --sz-none:#8795A3;      /* גודל עסק: בלי אף עובד שכיר */
  --sz-1:#D9B678;         /* גודל עסק: 1–9 משרות */
  --sz-2:#A8702E;         /* גודל עסק: 10–49 משרות */
  --na-fill:#F2F1EE;      /* „אין נתון / לא פורסם” — רקע הריקוע */
  --na-line:#B3AFA7;      /* „אין נתון / לא פורסם” — קווי הריקוע */

  --f-ui:"Assistant", system-ui, sans-serif;
  --f-num:"Rubik", system-ui, sans-serif;
  /* סולם טיפוגרפי: 7 מדרגות (במקום 18 גדלים בקונסולה הקיימת) */
  --t-xs:12px; --t-s:13px; --t-m:14px; --t-l:16px; --t-xl:18px; --t-2xl:22px; --t-kpi:28px;
  --r:10px;
  --cur:var(--src-cbs); --cur-tint:var(--tint-cbs);
}
.app[data-tab="a"]{--cur:var(--src-cbs); --cur-tint:var(--tint-cbs)}
.app[data-tab="b"]{--cur:var(--src-btl); --cur-tint:var(--tint-btl)}
.app[data-tab="c"]{--cur:var(--src-biz); --cur-tint:var(--tint-biz)}

*{box-sizing:border-box}
html{background:var(--bg-page)}
body{margin:0; background:var(--bg-page); color:var(--ink); direction:rtl;
  font:400 var(--t-m)/1.5 var(--f-ui); -webkit-text-size-adjust:100%}
button,select,input{font:inherit; color:inherit}
[hidden]{display:none !important}
b, strong{font-weight:700}
.panel h2, .bl .ln{text-wrap:balance}
.hd h1 .proto{display:inline-block; vertical-align:middle; font:600 var(--t-xs)/1 var(--f-ui); color:var(--ink-2); background:var(--bg-page);
  border:1px solid var(--hair); border-radius:100px; padding:3px 8px; margin-inline-start:6px; letter-spacing:0}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
::selection{background:var(--bg-note)}
.num{font-family:var(--f-num); unicode-bidi:isolate; direction:ltr; font-variant-numeric:tabular-nums}
.num.ils{direction:rtl}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

.app{max-width:1500px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-bottom:28px}

/* --- כותרת + הרשות שלי --- */
.hd{display:flex; align-items:center; gap:10px 14px; padding:9px 0; flex-wrap:wrap}
.hd img{height:36px; width:auto}
.hd .ttl{min-width:0}
.hd h1{font:700 var(--t-xl)/1.2 var(--f-num); margin:0; letter-spacing:-.01em}
.hd .sub{font-size:var(--t-xs); color:var(--ink-3)}
.hd .acts{margin-inline-start:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.mine{display:flex; align-items:center; gap:6px; background:var(--bg-canvas); border:1.5px solid var(--line-sel);
  border-radius:100px; padding:3px 4px 3px 6px}
.mine label{font:700 var(--t-s) var(--f-num); color:var(--ink); padding-inline-start:8px; white-space:nowrap}
.mine select{font:600 var(--t-m)/1.2 var(--f-ui); border:0; background:var(--bg-sel); border-radius:100px; padding:6px 10px;
  color:var(--ink); min-height:34px; max-width:220px; cursor:pointer}
.mine .clr{border:0; background:none; cursor:pointer; color:var(--ink-3); font-size:var(--t-m); padding:4px 8px; border-radius:100px}
.mine .clr:hover{background:var(--bg-hover); color:var(--ink)}
.pill{font:600 var(--t-s)/1.2 var(--f-ui); color:var(--ink); background:var(--bg-canvas); border:1px solid var(--hair-2);
  border-radius:100px; padding:7px 13px; cursor:pointer; white-space:nowrap; min-height:34px}
.pill:hover{background:var(--bg-hover)}

/* --- השורה התחתונה --- */
.bl{background:var(--bg-claim); border:1px solid var(--hair); border-radius:var(--r); padding:8px 12px 9px; margin-bottom:8px}
.bl .bh{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.bl h2{font:700 var(--t-xs)/1 var(--f-num); color:var(--ink-2); margin:0; letter-spacing:.02em}
.bl .who{font-size:var(--t-xs); color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1}
.bl .bh{min-height:1.5em; flex-wrap:nowrap}
.bl .rows{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px 14px}
.bl .ln{display:flex; gap:8px; align-items:flex-start; text-align:start; border:0; background:none; padding:4px 6px; border-radius:6px;
  cursor:pointer; font:500 var(--t-s)/1.45 var(--f-ui); color:var(--ink); border-inline-start:3px solid transparent}
.bl .ln:hover{background:var(--bg-canvas)}
.bl .ln[aria-current="true"]{background:var(--bg-canvas); border-inline-start-color:var(--cur)}
.bl .ln .num{font-weight:700}
.bl .ln .go{color:var(--ink-3); margin-inline-start:auto; white-space:nowrap; font-size:var(--t-xs)}
.chip{display:inline-flex; align-items:center; font:600 var(--t-xs)/1 var(--f-num); color:var(--on-dark);
  padding:4px 7px; border-radius:4px; white-space:nowrap; flex:none; margin-top:1px}
.chip.a{background:var(--src-cbs)} .chip.b{background:var(--src-btl)} .chip.c{background:var(--src-biz)}
.note3{display:flex; align-items:center; gap:8px; background:var(--bg-note); border-radius:8px; padding:5px 10px; margin-bottom:8px;
  font-size:var(--t-s); color:var(--ink)}
.note3 .lnk{border:0; background:none; font:700 var(--t-s) var(--f-ui); color:var(--ink); text-decoration:underline; cursor:pointer; padding:2px 4px}
.note3 .x{margin-inline-start:auto; border:0; background:none; cursor:pointer; color:var(--ink-2); padding:2px 8px; border-radius:6px; font-size:var(--t-m)}
.note3 .x:hover{background:var(--bg-canvas)}

/* --- לשוניות + תגי הקשר --- */
/* לשוניות: דביקות בראש המסך, גדולות, נראות כלשוניות — הפעילה מלאה בצבע המקור; השאר מסגרת ולחיצות */
.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; display:flex; align-items:center; gap:10px; padding:8px 0;
  background:var(--bg-page); border-bottom:2px solid var(--cur); box-shadow:0 6px 10px -10px rgba(20,39,63,.35)}
.tcount{font:700 var(--t-s) var(--f-num); color:var(--ink-2); white-space:nowrap}
.tablist{display:flex; gap:8px; flex:1}
.tablist button{flex:1 1 0; min-width:0; text-align:start; cursor:pointer; padding:9px 14px; border-radius:10px;
  background:var(--bg-canvas); border:1.5px solid var(--hair-2); border-bottom:4px solid var(--hair-2); color:var(--ink)}
.tablist button:hover{background:var(--bg-hover); border-color:var(--tc)}
.tablist button strong{display:block; font:700 var(--t-xl)/1.2 var(--f-num); color:var(--ink)}
.tablist button strong .short{display:none}
.tablist button .src{display:block; font-size:var(--t-xs); color:var(--ink-2); margin-top:2px}
.tablist button[aria-selected="true"]{background:var(--tc); border-color:var(--tc); border-bottom-color:var(--ink);
  box-shadow:0 4px 12px -4px rgba(20,39,63,.45); transform:translateY(-1px)}
.tablist button[aria-selected="true"] strong, .tablist button[aria-selected="true"] .src{color:var(--on-dark)}
.tablist button[aria-selected="true"] strong::before{content:"● "; font-size:.7em; vertical-align:middle}
.tablist button.a{--tc:var(--src-cbs)} .tablist button.b{--tc:var(--src-btl)} .tablist button.c{--tc:var(--src-biz)}
.ctx{display:flex; gap:5px; flex-wrap:wrap; padding:8px 0 6px}
.tag{font-size:var(--t-xs); color:var(--ink-2); background:var(--bg-canvas); border:1px solid var(--hair); border-radius:100px; padding:3px 10px; white-space:nowrap}
.tag.src{background:var(--cur); color:var(--on-dark); border-color:var(--cur); font-weight:700}
.tag.me{background:var(--bg-sel); border-color:var(--line-sel); color:var(--ink); font-weight:700}

/* --- סרגל בוררים --- */
.fbar{display:flex; align-items:center; gap:8px 18px; flex-wrap:wrap; background:var(--cur-tint); padding:8px 12px;
  border-radius:var(--r); border:1px solid var(--hair)}
.fgrp{display:flex; align-items:center; gap:8px}
.fgrp > .lbl{font:700 var(--t-s) var(--f-num); color:var(--ink-2)}
.scope{font-size:var(--t-xs); color:var(--ink-2)}
.fdef{margin-inline-start:auto; font-size:var(--t-xs); color:var(--ink-2); max-width:52ch; line-height:1.4}
.seg{display:inline-flex; background:var(--bg-canvas); border:1px solid var(--hair-2); border-radius:100px; padding:2px; gap:2px}
.seg button{border:0; background:none; border-radius:100px; padding:5px 13px; font:600 var(--t-s)/1.2 var(--f-ui); color:var(--ink-2); cursor:pointer; min-height:30px}
.seg button:hover{background:var(--bg-hover)}
.seg button[aria-pressed="true"]{background:var(--cur); color:var(--on-dark)}
.seg.sm button{padding:4px 10px; font-size:var(--t-xs); min-height:28px}

/* --- הודעת „אין רמת רשות” / משפט מצב --- */
.nolvl{min-height:40px; margin-top:10px; background:var(--bg-sel); border:1px solid var(--line-sel); border-radius:var(--r); padding:8px 12px; font-size:var(--t-s)}
.nolvl b{font-weight:700}

/* --- מדדים --- */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:10px}
.kpi{min-height:96px; background:var(--bg-canvas); border:1px solid var(--hair); border-radius:var(--r); padding:9px 13px 10px;
  border-inline-start:4px solid var(--cur); box-shadow:0 1px 3px rgba(20,39,63,.06); min-width:0}
.kpi.me{background:var(--bg-sel); border-color:var(--line-sel); border-inline-start-color:var(--cur)}
.kpi .k{font:600 var(--t-s)/1.3 var(--f-ui); color:var(--ink-2)}
.kpi .v{font:700 var(--t-kpi)/1.15 var(--f-num); color:var(--ink); margin:2px 0 1px; letter-spacing:-.01em}
.kpi .v.na{font-size:var(--t-xl); color:var(--ink-2); font-weight:600}
.kpi .n{font-size:var(--t-xs); color:var(--ink-2); line-height:1.4}
.kcav{margin-top:8px; font-size:var(--t-xs); color:var(--ink-2); background:var(--bg-caveat); border:1px solid var(--line-caveat);
  border-radius:8px; padding:5px 10px; line-height:1.45}
.kcav b{color:var(--ink)}

/* --- גריד הפאנלים --- */
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:12px; align-items:start}
.panel{background:var(--bg-canvas); border:1px solid var(--hair); border-radius:var(--r); padding:13px 16px 10px;
  box-shadow:0 1px 3px rgba(20,39,63,.06); min-width:0}
.panel.full{grid-column:1 / -1}
.p-head{display:flex; gap:8px 12px; align-items:flex-start; flex-wrap:wrap}
.p-head .tt{flex:1 1 320px; min-width:0}
.p-kick{font:700 var(--t-xs)/1 var(--f-num); color:var(--ink-3); letter-spacing:.02em; margin-bottom:5px; display:flex; gap:6px; align-items:center}
.p-kick .new{background:var(--bg-sel); border:1px solid var(--line-sel); color:var(--ink); border-radius:4px; padding:2px 5px}
.panel h2{font:700 var(--t-2xl)/1.3 var(--f-num); margin:0; color:var(--ink); letter-spacing:-.01em}
.p-meta{font-size:var(--t-xs); color:var(--ink-3); margin-top:4px; line-height:1.4}
.take{margin:9px 0 0; font:500 var(--t-l)/1.45 var(--f-ui); color:var(--ink-2); border-inline-start:3px solid var(--cur); padding-inline-start:10px}
.take .num{font-weight:700; color:var(--ink)}
.p-det{margin:8px 0 0; font-size:var(--t-s); color:var(--ink-2); line-height:1.5}
.p-sub{font-size:var(--t-s); color:var(--ink-2); margin-top:3px; line-height:1.45}
.p-ctl{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.vtog{display:inline-flex; background:var(--bg-page); border:1px solid var(--hair-2); border-radius:100px; padding:2px}
.vtog button{border:0; background:none; border-radius:100px; padding:4px 11px; font:600 var(--t-xs)/1.2 var(--f-ui); color:var(--ink-2); cursor:pointer; min-height:28px}
.vtog button[aria-pressed="true"]{background:var(--bg-canvas); color:var(--ink); box-shadow:0 1px 2px rgba(20,39,63,.12)}
.verdict{margin-top:9px; background:var(--bg-claim); border-inline-start:3px solid var(--cur); border-radius:6px; padding:7px 11px;
  font:600 var(--t-s)/1.5 var(--f-ui); color:var(--ink)}
.p-body{margin-top:10px}
.chartbox{width:100%}
.chartbox svg{display:block; overflow:visible}
.chartbox .mk{outline:none}
.chartbox .mk:focus-visible rect.hl, .chartbox .mk:focus rect.hl{stroke:var(--ink); stroke-width:2}
.more{margin-top:6px; border:1px dashed var(--hair-2); background:var(--bg-canvas); border-radius:100px; padding:5px 14px; cursor:pointer;
  font:700 var(--t-s) var(--f-ui); color:var(--ink)}
.more:hover{background:var(--bg-hover)}
.cav{background:var(--bg-caveat); border:1px solid var(--line-caveat); border-radius:8px; padding:6px 10px; font-size:var(--t-xs);
  color:var(--ink-2); margin-top:9px; line-height:1.5}
.cav b{color:var(--ink)}
.p-foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; border-top:1px solid var(--hair); margin-top:10px; padding-top:8px}
.p-foot .src{font-size:var(--t-xs); color:var(--ink-3); flex:1 1 280px; line-height:1.45}
.btn{font:600 var(--t-xs)/1.2 var(--f-ui); color:var(--ink); background:var(--bg-canvas); border:1px solid var(--hair-2);
  border-radius:100px; padding:5px 11px; cursor:pointer; white-space:nowrap; min-height:28px}
.btn:hover{background:var(--bg-hover)}
.msg{padding:18px 4px; color:var(--ink-2); font-size:var(--t-m)}
.msg .seg{margin-top:8px}

/* --- טבלאות --- */
.tw{overflow-x:auto; border:1px solid var(--hair); border-radius:8px; background:var(--bg-canvas)}
table.d{border-collapse:separate; border-spacing:0; width:100%; font-size:var(--t-xs)}
table.d caption{text-align:start; font-size:var(--t-xs); color:var(--ink-3); padding:6px 8px; caption-side:bottom}
table.d th{background:var(--bg-page); text-align:start; padding:0; border-bottom:1px solid var(--hair-2); white-space:nowrap; vertical-align:bottom}
table.d th button{all:unset; display:block; padding:7px 8px; font:700 var(--t-xs)/1.25 var(--f-num); color:var(--ink-2); cursor:pointer; white-space:normal; max-width:13em}
table.d th button:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}
table.d th .ar{color:var(--ink-3); margin-inline-start:3px}
table.d th[aria-sort="ascending"] button, table.d th[aria-sort="descending"] button{color:var(--ink)}
table.d td{padding:5px 8px; border-bottom:1px solid var(--hair); white-space:nowrap; color:var(--ink)}
table.d td.n{font-family:var(--f-num); direction:ltr; unicode-bidi:isolate; text-align:right; font-variant-numeric:tabular-nums}
table.d td.na{color:var(--ink-2); font-style:italic; white-space:normal}
table.d tr.sel td{background:var(--bg-sel); font-weight:700}
table.d tr.pin td{font-weight:700; background:var(--bg-page)}
table.d tr:hover td{background:var(--bg-hover)}
.live{margin-top:12px}
.live .p-head h2{font-size:var(--t-l)}

/* --- מה הלשונית אינה עונה עליו --- */
.handoff{margin-top:12px; background:var(--bg-canvas); border:1px solid var(--hair); border-radius:var(--r); padding:13px 16px}
.handoff h2{font:700 var(--t-l)/1.3 var(--f-num); margin:0 0 10px}
.hrow{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.hcard{text-align:start; background:var(--bg-page); border:1px solid var(--hair); border-inline-start:4px solid var(--tc); border-radius:8px;
  padding:9px 12px; cursor:pointer; display:flex; flex-direction:column; gap:3px; font-family:var(--f-ui)}
.hcard:hover{background:var(--bg-canvas); box-shadow:0 4px 14px rgba(20,39,63,.10)}
.hcard.a{--tc:var(--src-cbs)} .hcard.b{--tc:var(--src-btl)} .hcard.c{--tc:var(--src-biz)} .hcard.x{--tc:var(--hair-2); cursor:default}
.hcard.x:hover{background:var(--bg-page); box-shadow:none}
.hcard .q{font:600 var(--t-m)/1.4 var(--f-ui); color:var(--ink)}
.hcard .tease{font-size:var(--t-s); color:var(--ink-2)}
.hcard .to{font:700 var(--t-s) var(--f-num); color:var(--ink)}
.hcard .keep{font-size:var(--t-xs); color:var(--ink-3)}

.why3{margin-top:16px; background:var(--bg-canvas); border:1px solid var(--hair); border-radius:var(--r); padding:14px 16px}
.why3 h2{font:700 var(--t-xl)/1.3 var(--f-num); margin:0 0 10px}
.why3 p{font-size:var(--t-m); color:var(--ink-2); line-height:1.6; margin:8px 0 0}
.w3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.w3c{display:flex; flex-direction:column; gap:4px; background:var(--bg-page); border:1px solid var(--hair); border-inline-start:4px solid var(--tc); border-radius:8px; padding:9px 12px; font-size:var(--t-s)}
.w3c .chip{align-self:flex-start}
.w3c.a{--tc:var(--src-cbs)} .w3c.b{--tc:var(--src-btl)} .w3c.c{--tc:var(--src-biz)}
.why3 .lnk{border:0; background:none; font:700 var(--t-m) var(--f-ui); color:var(--ink); text-decoration:underline; cursor:pointer; padding:2px 0; min-height:32px}
@media (max-width:700px){ .w3{grid-template-columns:minmax(0,1fr)} }
.ft{margin-top:16px; font-size:var(--t-xs); color:var(--ink-3); display:flex; gap:6px 12px; flex-wrap:wrap}

/* --- מגירת „על הנתונים” --- */
.scrim{position:fixed; inset:0; background:rgba(20,39,63,.35); z-index:40}
.drawer{position:fixed; top:0; bottom:0; inset-inline-end:0; width:min(560px, 92vw); background:var(--bg-canvas); z-index:41;
  box-shadow:0 20px 50px -20px rgba(20,39,63,.42); overflow:auto; padding:18px 20px 30px; transform:translateX(-102%);
  transition:transform .22s ease; visibility:hidden; direction:rtl}
.drawer.open{transform:none; visibility:visible}
/* ≤600px: גיליון מלמטה ברוחב מלא (התקן האחיד §4, U-8) */
@media (max-width:600px){
  .drawer{top:auto; inset-inline:0; width:100vw; max-height:88vh; border-radius:14px 14px 0 0; transform:translateY(102%)}
  .drawer.open{transform:none}
}
.drawer h2{font:700 var(--t-2xl)/1.25 var(--f-num); margin:0 0 4px}
.drawer h3{font:700 var(--t-l)/1.3 var(--f-num); margin:20px 0 6px; display:flex; gap:8px; align-items:center}
.drawer p, .drawer li{font-size:var(--t-s); color:var(--ink-2); line-height:1.6}
.drawer ul{padding-inline-start:18px; margin:4px 0}
.drawer dt{font:700 var(--t-s) var(--f-num); color:var(--ink); margin-top:8px}
.drawer dd{margin:2px 0 0; font-size:var(--t-s); color:var(--ink-2); line-height:1.55}
.drawer dd q{quotes:"„" "”"}
.drawer dd .plain{display:block; color:var(--ink-3); font-size:var(--t-xs)}
.drawer .x{position:sticky; top:0; float:left}
.drawer .why2{background:var(--bg-note); border-radius:8px; padding:10px 12px; font-size:var(--t-s); color:var(--ink); line-height:1.6}
.drawer table{border-collapse:collapse; width:100%; font-size:var(--t-xs)}
.drawer th, .drawer td{padding:5px 7px; border-bottom:1px solid var(--hair); text-align:start; vertical-align:top}
.drawer th{background:var(--bg-page); font:700 var(--t-xs) var(--f-num); color:var(--ink-2); white-space:nowrap}

/* --- tooltip / toast (נדרש ל-LIB) --- */
.lib-tip{position:fixed; z-index:100; background:var(--ink); color:var(--on-dark); padding:8px 10px; border-radius:8px;
  font:400 var(--t-xs)/1.45 var(--f-ui); pointer-events:none; max-width:300px; min-width:150px;
  box-shadow:0 18px 40px -18px rgba(20,39,63,.55); direction:rtl}
.lib-tip .t{font:700 var(--t-xs)/1.3 var(--f-num); color:var(--tip-title); margin-bottom:4px}
.lib-tip .r{display:flex; justify-content:space-between; gap:14px}
.lib-tip .r span{color:var(--on-dark)}
.lib-tip .r b{font-weight:600}
.lib-toast{position:fixed; z-index:101; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--on-dark);
  font:600 var(--t-s)/1.4 var(--f-ui); padding:9px 14px; border-radius:8px; box-shadow:0 18px 40px -18px rgba(20,39,63,.55);
  max-width:min(92vw, 520px); text-align:center; direction:rtl}

@media (max-width:1100px){
  .bl .rows{grid-template-columns:minmax(0,1fr)}
  .bl .ln{padding:2px 6px}
  .hrow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1101px){ .bl .ln .go{display:none} }
@media (max-width:1100px) and (min-width:901px){
  /* גובה שמור: טענה של רשות ארוכה מזו של האשכול — בלי קפיצת פריסה (U-2) */
  .bl .ln{min-height:56px}
  .nolvl{min-height:58px}
  .bl .rows{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bl .ln{font-size:var(--t-xs)}

}
@media (max-width:900px){

  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctx{margin-inline-start:0; width:100%}
  .fdef{margin-inline-start:0; max-width:none}
}
@media (max-width:560px){
  .hd{gap:8px}

  .hd h1{font-size:var(--t-l)}
  .hd .sub{display:none}
  .hd .acts{width:100%; margin:0}
  .mine{flex:1 1 100%}
  .mine select{flex:1; max-width:none}
  .hd .acts .pill{flex:1}
  .tablist button strong{font-size:var(--t-l)}
  .kpi{padding:8px 10px}
  .kpi .v{font-size:var(--t-2xl)}
  .panel{padding:11px 11px 8px}
  .panel h2{font-size:var(--t-xl)}
  .take{font-size:var(--t-m)}
  .hrow{grid-template-columns:minmax(0,1fr)}
  .bl .ln .go{display:none}
  .scope{display:none}
  .note3{font-size:var(--t-xs); padding:4px 8px}
  .note3 .lnk{font-size:var(--t-xs)}
}
.blmore, .fsum, .more.mob{display:none}
.skip{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; padding:0}
.skip:focus{position:static; width:auto; height:auto; clip:auto; margin-bottom:6px; padding:4px 10px; border:1px solid var(--hair-2); border-radius:100px; background:var(--bg-canvas); font:600 var(--t-xs) var(--f-ui); cursor:pointer}
@media (max-width:560px){
  /* מעטפת מקופלת בטלפון: הגרף הראשון מתחיל במסך הראשון */
  .hd{padding:6px 0}
  .hd .acts .pill{min-height:40px; padding:4px 10px; font-size:var(--t-xs)}
  .mine select{min-height:32px; padding:4px 10px}
  .bl{padding:6px 10px 6px}
  .bl .bh{margin-bottom:4px}
  .bl .who{display:none}
  .blmore{display:inline-block; margin-inline-start:auto; border:1px solid var(--hair-2); background:var(--bg-canvas); border-radius:100px;
    font:600 var(--t-xs) var(--f-ui); padding:3px 10px; cursor:pointer; color:var(--ink)}
  .bl:not(.open) .ln:not([aria-current="true"]){display:none}
  .bl .ln{font-size:var(--t-xs); line-height:1.4; min-height:56px}
  .note3 .long{display:none}
  .note3{margin-bottom:6px}
  .tcount{display:none}
  .tabs{gap:6px; padding:6px 0}
  .tablist{gap:6px}
  .tablist button{padding:6px 6px 5px}
  .tablist button strong{font-size:var(--t-l); line-height:1.2}
  .tablist button strong .full{display:none}
  .tablist button strong .short{display:inline}
  .ctx{padding:4px 0}
  .ctx .tag:not(.src):not(.me){display:none}
  .fbar{padding:5px 8px}
  .fsum{display:block; width:100%; text-align:start; border:0; background:none; cursor:pointer; font:500 var(--t-s) var(--f-ui); color:var(--ink); padding:4px 2px}
  .fbar:not(.open) > :not(.fsum){display:none}
  .kpis{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:8px; margin-top:8px; padding-bottom:4px}
  .kpi{flex:0 0 78%; scroll-snap-align:start; padding:7px 10px; min-height:0}
  .kpi .k{font-size:var(--t-xs)}
  .kpi .v{font-size:var(--t-2xl)}
  .kpi .n{font-size:var(--t-xs)}
  .kcav{display:none}
  .grid{margin-top:8px}
  .more.mob{display:inline-block}
  /* יעדי מגע ≥40px (התקן §4) */
  .pill, .seg button, .vtog button, .btn, .more, .blmore, .fsum, .note3 .x, .note3 .lnk, .mine .clr, .mine select, [role=tab], table.d th button{min-height:40px}
  .vtog button{min-width:44px}
  .seg, .vtog{gap:4px}
  .hd .acts{gap:8px}
  .panel{padding:10px 10px 8px}
  .hd h1 .proto{display:none}
  .nolvl{min-height:58px; padding:6px 10px}
  .nolvl .dt{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

/* יעדי מגע ≥40px ב-≤600px גם לכפתורי מיון בכותרות טבלה ולבוררים הקטנים בתוך פאנל (סבב פרטים, QA 09/11/2026) */

   ========================================================================== */
const LIB = (() => {
  /* איות אחד לכל רשות — של חלק א׳ (החלטת המשתמש, 15/10/2026). חלק ב׳ מאיית כקובץ הצימודים. */
  const NAME_FIX = {
    "קרית שמונה": "קריית שמונה", "טובא-זנגריה": "טובא-זנגרייה", "הגולן": "גולן",
    "בוקעתא": "בוקעאתא", "עין קיניה": "עין קנייא", "עג'ר": "ע'ג'ר",
    "גליל עליון": "הגליל העליון", "מבואות חרמון": "מבואות החרמון",
    "גוש חלב(ג'ש)": "ג'ש (גוש חלב)", "גוש חלב": "ג'ש (גוש חלב)"
  };
  const fixName = s => NAME_FIX[s] || s;
  /* אות שימוש ב/ל/כ לפני שם עם ה״א הידיעה: „בגליל העליון”, „לשכר הממוצע”. רק לה״א של יידוע — רשימה סגורה, כי
     ב„הובלה יבשתית” או „הוצאה לאור” ה-ה היא חלק מהמילה („בהובלה” נכון). */
  const ARTICLE = /^ה(?=גליל העליון|שכר|ממוצע|ארץ|אשכול|רשות|מחוז|צפון)/;
  const pre = (p, n) => p + (/^[בלכ]$/.test(p) && ARTICLE.test(n) ? n.slice(1) : n);

  const niceTicks = (lo, hi, n = 5) => {

  const cleanCell = c => {
    if (c == null) return "";
    if (typeof c === "number") return Number.isFinite(c) ? String(+c.toFixed(6)) : "";

  /* ייצוא PNG של SVG בתוך כרטיס: כותרת · כותרת משנה · הגרף · הערה (סייג) · שורת מקור + לוגו.

    .replace(/(?<![\p{L}\d])[+\u2212\-]?\d[\d,.]*%?(?:\s*[–\-]\s*[+\u2212\-]?\d[\d,.]*%?)+|(?<![\p{L}\d])[+\u2212×]\d[\d,.]*%?/gu, m => "\u2066" + m + "\u2069")

  async function exportPNG({ svg, title, subtitle = "", note = "", source = "", logo, filename = "chart.png", scale = 2 }) {

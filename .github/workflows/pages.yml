# מפרסם את index.html ל-GitHub Pages בכל דחיפה ל-main.
#
# הקובץ שמגיע לכאן הוא הגרסה הציבורית של הדשבורד בלבד: אותם נתונים ואותם גרפים,
# בלי „תובנות” ובלי הגישה אליהן. הגרסה הפנימית לעולם אינה מתפרסמת — ראו השער למטה.
#
# הכתובת: https://benjamendro.github.io/east-galilee-salary-dashboard/

name: פרסום הדשבורד

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פרסום אחד בכל רגע; ריצה חדשה ממתינה ואינה מבטלת פרסום שכבר יצא לדרך
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # השער: רק הגרסה הציבורית עולה לאוויר, והוא בודק את התכונות עצמן
      # ולא רק סימון שאפשר לשכוח לעדכן.
      - name: אימות שהקובץ ראוי לפרסום
        run: |
          # (1) המטען המוטמע אינו נושא ולו תובנה אחת
          grep -qF '"insights":[]' index.html || {
            echo "::error::index.html נושא תובנות במטען — הן דורשות מעבר מומחה ואינן מתפרסמות."
            exit 1
          }
          # (2) אין קישור ל-Artifact פנימי (הדו״ח המלא והתובנות)
          if grep -qF 'claude.ai/code/artifact' index.html; then
            echo "::error::index.html מקשר ל-Artifact פנימי. הפרסום נעצר."
            exit 1
          fi
          # (3) הקובץ מצהיר על עצמו כניתוב הציבורי
          grep -qF 'const PUBLIC = true;' index.html || {
            echo "::error::index.html אינו מצהיר על הניתוב הציבורי."
            exit 1
          }
          if grep -qF 'const PUBLIC = false;' index.html; then
            echo "::error::index.html הוא הגרסה הפנימית. הפרסום נעצר."
            exit 1
          fi

      # לאתר נכנס הדשבורד בלבד — לא ה-README ולא קובצי ה-workflow
      - name: הרכבת האתר
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      # Pages מופעל פעם אחת ידנית: Settings → Pages → Source: GitHub Actions.
      # אין כאן enablement: true — ה-GITHUB_TOKEN אינו רשאי ליצור אתר Pages
      # („Resource not accessible by integration”), וזו הגדרה של בעל המאגר.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

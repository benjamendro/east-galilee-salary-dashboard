# מפרסם את האתר ל-GitHub Pages בכל דחיפה ל-main.
#
# הקבצים כאן מגיעים אוטומטית מהתיקייה shared/ במאגר הפרטי (sync-to-shared.yml שם),
# ורק ממנה. index.html הוא הגרסה הציבורית של הדשבורד: אותם נתונים ואותם גרפים, בלי
# „תובנות” ובלי הגישה אליהן. bot-data/ הוא טבלאות CSV של אותם נתונים, לבוט ה-AI.
# הגרסה הפנימית לעולם אינה מתפרסמת — ראו השער למטה.
#
# הכתובת: https://benjamendro.github.io/east-galilee-salary-dashboard/

name: פרסום הדשבורד

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פרסום אחד בכל רגע; ריצה חדשה ממתינה ואינה מבטלת פרסום שכבר יצא לדרך
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # השער: רק הגרסה הציבורית עולה לאוויר, והוא בודק את התכונות עצמן
      # ולא רק סימון שאפשר לשכוח לעדכן.
      - name: אימות שהקבצים ראויים לפרסום
        run: |
          shopt -s globstar nullglob
          pages=( ./**/*.html )
          [ ${#pages[@]} -gt 0 ] || { echo "::error::אין אף עמוד HTML לפרסום."; exit 1; }
          for f in "${pages[@]}"; do
            # (1) המטען המוטמע אינו נושא ולו תובנה אחת
            grep -qF '"insights":[]' "$f" || {
              echo "::error::$f נושא תובנות במטען — הן דורשות מעבר מומחה ואינן מתפרסמות."
              exit 1
            }
            # (3) אין בקובץ מצב עריכה — הצופה בקישור הציבורי אינו עורך את הטקסט.
            # בקונסולה מצב העריכה מוסר **פיזית** ב-build_console.py, ולכן החיפוש הזה
            # תופס אותו. (בדו״ח הנרטיבי הוא מוסר בזמן ריצה, ולכן הדו״ח לא יעבור את
            # השער הזה כמו שהוא — לפני פרסום שלו צריך להסירו פיזית באותה דרך.)
            for leftover in 'id="editToggle"' 'id="editbar"' 'wireEditing'; do
              if grep -qF "$leftover" "$f"; then
                echo "::error::$f עדיין מכיל $leftover — מצב העריכה נגיש בקובץ המפורסם."
                exit 1
              fi
            done
            # (4) הקובץ מצהיר על עצמו כניתוב הציבורי
            grep -qF 'const PUBLIC = true;' "$f" || {
              echo "::error::$f אינו מצהיר על הניתוב הציבורי."
              exit 1
            }
            if grep -qF 'const PUBLIC = false;' "$f"; then
              echo "::error::$f הוא הגרסה הפנימית. הפרסום נעצר."
              exit 1
            fi
          done
          # (2) אין קישור ל-Artifact פנימי (הדו״ח המלא והתובנות), בשום קובץ שמתפרסם
          if grep -rIlF --exclude-dir=.git --exclude-dir=.github 'claude.ai/code/artifact' . \
             || grep -rIlF --exclude-dir=.git --exclude-dir=.github 'claude.ai/artifact' .; then
            echo "::error::קובץ מקשר ל-Artifact פנימי. הפרסום נעצר."
            exit 1
          fi

      # לאתר נכנס כל מה שהגיע מ-shared/ (index.html, bot-data/ …) — לא ה-README,
      # לא קובצי ה-workflow ולא version.json, שהם של המאגר ולא של האתר.
      - name: הרכבת האתר
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site \
              --exclude=./README.md --exclude=./version.json -cf - . | tar -xf - -C _site
          echo "Published files:"; (cd _site && find . -type f | sort)

      # Pages מופעל פעם אחת ידנית: Settings → Pages → Source: GitHub Actions.
      # אין כאן enablement: true — ה-GITHUB_TOKEN אינו רשאי ליצור אתר Pages
      # („Resource not accessible by integration”), וזו הגדרה של בעל המאגר.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
